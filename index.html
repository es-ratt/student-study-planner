<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- This line auto-redirects the browser to pages/index.html after 0 seconds -->
  <!-- It exists because GitHub Pages needs an index.html at the root, -->
  <!-- but the real homepage lives inside the pages/ folder -->
  <meta http-equiv="refresh" content="0; url=pages/index.html" />
  <title>Study Planner</title>
</head>
<body>
  <!-- Fallback link, in case the browser doesn't support auto-redirect -->
  <p>Redirecting to <a href="pages/index.html">Study Planner</a>...</p>
</body>
</html>
