<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exams — Study Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="navbarRoot"></div>
  <div id="sidebarRoot"></div>

  <main id="pageContent" class="main-content">
    <div class="page-header">
      <h2>Exams</h2>
      <button class="btn btn-primary rounded-pill px-4" id="addExamBtn"><i class="fa-solid fa-plus me-1"></i>Add Exam</button>
    </div>

    <div class="row" id="examList"></div>
  </main>

  <div id="fabRoot"></div>

  <div class="modal fade" id="examModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="examModalTitle">Add Exam</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="examForm">
            <input type="hidden" id="examId" />
            <div class="mb-3">
              <label class="form-label">Exam Name *</label>
              <input type="text" class="form-control" id="examName" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Subject</label>
              <select class="form-select" id="examSubject"><option value="">None</option></select>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Date *</label>
                <input type="date" class="form-control" id="examDate" required />
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Time</label>
                <input type="time" class="form-control" id="examTime" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Room</label>
              <input type="text" class="form-control" id="examRoom" placeholder="e.g. Room 204" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveExamBtn">Save Exam</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import {
      getAllExams, addExam, updateExam, deleteExam, getExamById,
      getExamStatus, setPrepPercentage,
    } from '../js/modules/examManager.js';
    import { getAllSubjects, getSubjectById } from '../js/modules/subjectManager.js';
    import { formatCountdown, formatDate, formatTime } from '../js/utils/dateHelpers.js';
    import { showToast } from '../js/components/toast.js';

    const examModal = new bootstrap.Modal(document.getElementById('examModal'));

    function populateSubjectOptions() {
      const select = document.getElementById('examSubject');
      select.innerHTML = '<option value="">None</option>' +
        getAllSubjects().map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    const STATUS_CLASS = { today: 'status-overdue', upcoming: 'status-pending', scheduled: 'status-pending', completed: 'status-completed', unknown: 'status-pending' };

    function renderExamList() {
      const container = document.getElementById('examList');
      const exams = [...getAllExams()].sort((a, b) => new Date(a.date) - new Date(b.date));

      if (exams.length === 0) {
        container.innerHTML = `<div class="col-12 empty-state"><i class="fa-solid fa-graduation-cap"></i><p>No exams scheduled. Add one to start prepping.</p></div>`;
        return;
      }

      container.innerHTML = exams.map((exam) => {
        const subject = exam.subjectId ? getSubjectById(exam.subjectId) : null;
        const status = getExamStatus(exam);
        return `
          <div class="col-md-6 col-lg-4 mb-4" data-id="${exam.id}">
            <div class="card h-100 shadow-sm border-0" style="border-left: 5px solid ${subject ? subject.color : 'var(--accent-color)'};">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title mb-0">${exam.name}</h5>
                  <span class="status-badge ${STATUS_CLASS[status]}">${formatCountdown(exam.date)}</span>
                </div>
                <p class="text-muted-custom small mb-2">${subject ? subject.name : 'No subject'}</p>
                <div class="small text-muted-custom mb-3">
                  <div><i class="fa-solid fa-calendar-days me-1"></i>${formatDate(exam.date)} ${exam.time ? '· ' + formatTime(exam.time) : ''}</div>
                  ${exam.room ? `<div><i class="fa-solid fa-location-dot me-1"></i>${exam.room}</div>` : ''}
                </div>
                <label class="small text-muted-custom">Preparation: ${exam.prepPercentage}%</label>
                <input type="range" class="form-range prep-range" min="0" max="100" value="${exam.prepPercentage}" />
                <div class="d-flex gap-2 mt-2">
                  <button class="btn btn-sm btn-outline-primary edit-exam-btn">Edit</button>
                  <button class="btn btn-sm btn-outline-danger delete-exam-btn">Delete</button>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');

      attachExamEvents();
    }

    function attachExamEvents() {
      document.querySelectorAll('.prep-range').forEach((range) => {
        range.addEventListener('change', (e) => {
          const id = e.target.closest('[data-id]').dataset.id;
          setPrepPercentage(id, parseInt(e.target.value, 10));
          showToast('Preparation updated', 'success');
        });
      });

      document.querySelectorAll('.edit-exam-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => openEditModal(e.target.closest('[data-id]').dataset.id));
      });

      document.querySelectorAll('.delete-exam-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const id = e.target.closest('[data-id]').dataset.id;
          if (!confirm('Delete this exam?')) return;
          deleteExam(id);
          showToast('Exam deleted', 'success');
          renderExamList();
        });
      });
    }

    function openAddModal() {
      document.getElementById('examModalTitle').textContent = 'Add Exam';
      document.getElementById('examId').value = '';
      document.getElementById('examForm').reset();
      examModal.show();
    }

    function openEditModal(id) {
      const exam = getExamById(id);
      if (!exam) return;
      document.getElementById('examModalTitle').textContent = 'Edit Exam';
      document.getElementById('examId').value = exam.id;
      document.getElementById('examName').value = exam.name;
      document.getElementById('examSubject').value = exam.subjectId || '';
      document.getElementById('examDate').value = exam.date || '';
      document.getElementById('examTime').value = exam.time || '';
      document.getElementById('examRoom').value = exam.room || '';
      examModal.show();
    }

    function saveExam() {
      const id = document.getElementById('examId').value;
      const name = document.getElementById('examName').value.trim();
      const date = document.getElementById('examDate').value;
      if (!name || !date) { showToast('Exam name and date are required', 'error'); return; }

      const payload = {
        name,
        subjectId: document.getElementById('examSubject').value || null,
        date,
        time: document.getElementById('examTime').value,
        room: document.getElementById('examRoom').value.trim(),
      };

      if (id) {
        updateExam(id, payload);
        showToast('Exam updated', 'success');
      } else {
        addExam(payload);
        showToast('Exam added', 'success');
      }

      examModal.hide();
      renderExamList();
    }

    document.addEventListener('DOMContentLoaded', () => {
      populateSubjectOptions();
      renderExamList();
      document.getElementById('addExamBtn').addEventListener('click', openAddModal);
      document.getElementById('saveExamBtn').addEventListener('click', saveExam);
    });
  </script>
</body>
</html>
