<!--
  profile.html — View/edit account details

  Shows and updates the logged-in user's profile (name, university,
  department, semester, study goal). getCurrentUser() reads from
  authManager.js's in-memory cache — it's synchronous by design, but
  that cache only gets filled in once appReady resolves, so the page
  waits for that before calling loadProfile() at all.
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Study Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="navbarRoot"></div>
  <div id="sidebarRoot"></div>

  <main id="pageContent" class="main-content">
    <div class="page-header"><h2>Profile</h2></div>

    <div class="row">
      <div class="col-lg-8">
        <div class="widget-card">
          <div class="d-flex align-items-center gap-3 mb-4">
            <!-- Simple "avatar" — just the first letter of the user's name,
                 no image upload feature exists, so this is a reliable fallback -->
            <div class="rounded-circle d-flex align-items-center justify-content-center"
                 style="width:72px;height:72px;background:var(--accent-color);color:#fff;font-size:1.6rem;font-weight:700;" id="avatarInitial">?</div>
            <div>
              <h5 class="mb-0" id="profileNameDisplay">—</h5>
              <p class="text-muted-custom mb-0" id="profileEmailDisplay">—</p>
            </div>
          </div>

          <form id="profileForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="profileName" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">University</label>
                <input type="text" class="form-control" id="profileUniversity" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <input type="text" class="form-control" id="profileDepartment" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Semester</label>
                <input type="text" class="form-control" id="profileSemester" />
              </div>
              <div class="col-12 mb-3">
                <label class="form-label">Study Goal</label>
                <textarea class="form-control" id="profileGoal" rows="2" placeholder="e.g. Study 20 hours/week"></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-primary rounded-pill px-4">Save Changes</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="fabRoot"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { getCurrentUser, updateProfile } from '../js/modules/authManager.js';
    import { showToast } from '../js/components/toast.js';
    // appReady resolves once the login session AND all app data have
    // loaded — waiting on it here guarantees getCurrentUser() below
    // won't return null just because the page rendered too early
    import { appReady } from '../js/app.js';

    // Pulls the current user out of authManager's cache and fills every
    // field on the page — also used again after a successful save, so
    // the displayed name/avatar update immediately without a page reload
    function loadProfile() {
      const user = getCurrentUser();
      if (!user) return;

      document.getElementById('avatarInitial').textContent = user.name.charAt(0).toUpperCase();
      document.getElementById('profileNameDisplay').textContent = user.name;
      document.getElementById('profileEmailDisplay').textContent = user.email;

      document.getElementById('profileName').value = user.name || '';
      document.getElementById('profileUniversity').value = user.university || '';
      document.getElementById('profileDepartment').value = user.department || '';
      document.getElementById('profileSemester').value = user.semester || '';
      document.getElementById('profileGoal').value = user.studyGoal || '';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await appReady;
      loadProfile();

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        // updateProfile() is async — it's a real network call to PUT /api/auth/me,
        // not a local-only change, since account data lives on the server
        const result = await updateProfile({
          name: document.getElementById('profileName').value.trim(),
          university: document.getElementById('profileUniversity').value.trim(),
          department: document.getElementById('profileDepartment').value.trim(),
          semester: document.getElementById('profileSemester').value.trim(),
          studyGoal: document.getElementById('profileGoal').value.trim(),
        });

        if (result.success) {
          showToast('Profile updated', 'success');
          loadProfile(); // re-fill the display fields (name/avatar) with the saved values
        } else {
          showToast(result.error, 'error');
        }
      });
    });
  </script>
</body>
</html>
