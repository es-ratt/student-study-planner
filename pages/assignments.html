<!--
  assignments.html — Manage assignments

  Same overall pattern as planner.html (search + filter + a shared
  add/edit modal), but for assignments instead of tasks. The two extra
  fields assignments have that tasks don't are a submission link and a
  status (pending/completed) rather than a simple completed checkbox —
  status also drives the overdue/pending/completed badge coloring.
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments — Study Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="navbarRoot"></div>
  <div id="sidebarRoot"></div>

  <main id="pageContent" class="main-content">
    <div class="page-header">
      <h2>Assignments</h2>
      <button class="btn btn-primary rounded-pill px-4" id="addAssignmentBtn"><i class="fa-solid fa-plus me-1"></i>Add Assignment</button>
    </div>

    <!-- Search box + status/priority filters -->
    <div class="widget-card mb-3">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="text" id="assignmentSearch" class="form-control" placeholder="Search assignments..." />
        </div>
        <div class="col-md-3">
          <select id="assignmentStatusFilter" class="form-select">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="assignmentPriorityFilter" class="form-select">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
    </div>

    <div id="assignmentList"></div>
  </main>

  <div id="fabRoot"></div>

  <!-- Shared add/edit modal, same pattern as the task modal -->
  <div class="modal fade" id="assignmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="assignmentModalTitle">Add Assignment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="assignmentForm">
            <input type="hidden" id="assignmentId" />
            <div class="mb-3">
              <label class="form-label">Title *</label>
              <input type="text" class="form-control" id="assignmentTitle" required />
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Subject</label>
                <select class="form-select" id="assignmentSubject"><option value="">None</option></select>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Priority</label>
                <select class="form-select" id="assignmentPriority">
                  <option value="high">High</option>
                  <option value="medium" selected>Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Deadline</label>
              <input type="date" class="form-control" id="assignmentDeadline" />
            </div>
            <div class="mb-3">
              <label class="form-label">Submission Link</label>
              <input type="url" class="form-control" id="assignmentLink" placeholder="https://..." />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveAssignmentBtn">Save Assignment</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import {
      getAllAssignments, addAssignment, updateAssignment, deleteAssignment,
      markAssignmentComplete, searchAssignments, getAssignmentById, isOverdueAssignment,
    } from '../js/modules/assignmentManager.js';
    import { getAllSubjects, getSubjectById } from '../js/modules/subjectManager.js';
    import { formatCountdown } from '../js/utils/dateHelpers.js';
    import { showToast } from '../js/components/toast.js';

    const assignmentModal = new bootstrap.Modal(document.getElementById('assignmentModal'));

    // Fills the modal's "Subject" dropdown
    function populateSubjectOptions() {
      const select = document.getElementById('assignmentSubject');
      select.innerHTML = '<option value="">None</option>' +
        getAllSubjects().map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    // Applies search, then status filter, then priority filter,
    // and finally sorts everything by deadline (soonest first)
    function getFiltered() {
      const query = document.getElementById('assignmentSearch').value;
      const status = document.getElementById('assignmentStatusFilter').value;
      const priority = document.getElementById('assignmentPriorityFilter').value;

      let list = query ? searchAssignments(query) : getAllAssignments();
      return list.filter((a) => {
        if (status && a.status !== status) return false;
        if (priority && a.priority !== priority) return false;
        return true;
      }).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
    }

    function renderList() {
      const container = document.getElementById('assignmentList');
      const list = getFiltered();

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-file-lines"></i><p>No assignments yet.</p></div>`;
        return;
      }

      container.innerHTML = list.map((a) => {
        const subject = a.subjectId ? getSubjectById(a.subjectId) : null;
        const overdue = isOverdueAssignment(a);
        // Priority order matters here: completed beats overdue beats pending,
        // so a completed-but-technically-past-deadline item still shows green
        const statusClass = a.status === 'completed' ? 'status-completed' : overdue ? 'status-overdue' : 'status-pending';
        const statusText = a.status === 'completed' ? 'Completed' : formatCountdown(a.deadline);
        return `
          <div class="list-row" data-id="${a.id}">
            <input type="checkbox" class="form-check-input assignment-complete-cb" ${a.status === 'completed' ? 'checked' : ''} />
            ${subject ? `<span class="subject-dot" style="background:${subject.color}"></span>` : ''}
            <div class="flex-grow-1">
              <p class="list-row-title">${a.title}</p>
              <div class="small text-muted-custom">${subject ? subject.name : 'No subject'}${a.submissionLink ? ` · <a href="${a.submissionLink}" target="_blank">Submission link</a>` : ''}</div>
            </div>
            <span class="priority-badge priority-${a.priority}">${a.priority}</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
            <button class="btn btn-sm btn-outline-primary edit-assignment-btn"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger delete-assignment-btn"><i class="fa-solid fa-trash"></i></button>
          </div>`;
      }).join('');

      attachEvents();
    }

    function attachEvents() {
      document.querySelectorAll('.assignment-complete-cb').forEach((cb) => {
        cb.addEventListener('change', (e) => {
          const id = e.target.closest('.list-row').dataset.id;
          markAssignmentComplete(id, e.target.checked);
          renderList();
        });
      });

      document.querySelectorAll('.edit-assignment-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => openEditModal(e.target.closest('.list-row').dataset.id));
      });

      document.querySelectorAll('.delete-assignment-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const id = e.target.closest('.list-row').dataset.id;
          if (!confirm('Delete this assignment?')) return;
          deleteAssignment(id);
          showToast('Assignment deleted', 'success');
          renderList();
        });
      });
    }

    function openAddModal() {
      document.getElementById('assignmentModalTitle').textContent = 'Add Assignment';
      document.getElementById('assignmentId').value = '';
      document.getElementById('assignmentForm').reset();
      assignmentModal.show();
    }

    function openEditModal(id) {
      const a = getAssignmentById(id);
      if (!a) return;
      document.getElementById('assignmentModalTitle').textContent = 'Edit Assignment';
      document.getElementById('assignmentId').value = a.id;
      document.getElementById('assignmentTitle').value = a.title;
      document.getElementById('assignmentSubject').value = a.subjectId || '';
      document.getElementById('assignmentPriority').value = a.priority;
      document.getElementById('assignmentDeadline').value = a.deadline || '';
      document.getElementById('assignmentLink').value = a.submissionLink || '';
      assignmentModal.show();
    }

    function saveAssignment() {
      const id = document.getElementById('assignmentId').value;
      const title = document.getElementById('assignmentTitle').value.trim();
      if (!title) { showToast('Title is required', 'error'); return; }

      const payload = {
        title,
        subjectId: document.getElementById('assignmentSubject').value || null,
        priority: document.getElementById('assignmentPriority').value,
        deadline: document.getElementById('assignmentDeadline').value,
        submissionLink: document.getElementById('assignmentLink').value.trim(),
      };

      if (id) {
        updateAssignment(id, payload);
        showToast('Assignment updated', 'success');
      } else {
        addAssignment(payload);
        showToast('Assignment added', 'success');
      }

      assignmentModal.hide();
      renderList();
    }

    document.addEventListener('DOMContentLoaded', () => {
      populateSubjectOptions();
      renderList();

      document.getElementById('addAssignmentBtn').addEventListener('click', openAddModal);
      document.getElementById('saveAssignmentBtn').addEventListener('click', saveAssignment);
      ['assignmentSearch', 'assignmentStatusFilter', 'assignmentPriorityFilter'].forEach((id) => {
        document.getElementById(id).addEventListener('input', renderList);
        document.getElementById(id).addEventListener('change', renderList);
      });

      // Lets the floating "+" button trigger this page's add-assignment modal
      document.addEventListener('quickadd:assignment', openAddModal);
    });
  </script>
</body>
</html>
