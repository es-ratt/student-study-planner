<!--
  404.html — Not-found fallback page

  Simplest page in the project: no navbar, no sidebar, no data loading —
  just a centered message and a link home. It doesn't import app.js at
  all (unlike every other page), since a broken link shouldn't require
  a login check or a backend call just to show an error message.
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Study Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height:100vh; padding:24px;">
    <i class="fa-solid fa-compass fa-3x mb-3" style="color: var(--color-primary);"></i>
    <h1 class="fw-bold" style="font-size: 4rem;">404</h1>
    <p class="text-muted-custom mb-4">The page you're looking for doesn't exist or was moved.</p>
    <a href="index.html" class="btn btn-primary rounded-pill px-4">Back to Home</a>
  </div>

  <!-- Still applies the saved light/dark theme, even on an error page,
       so switching pages never causes a jarring flash back to light mode -->
  <script type="module">
    import { initTheme } from '../js/modules/themeManager.js';
    initTheme();
  </script>
</body>
</html>
