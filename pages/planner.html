<!--
  planner.html — Full task management page

  This is the "real" task manager — unlike the dashboard's quick-add,
  this page shows every task with search, filter (by priority/status),
  and sort controls, plus a full add/edit modal with subject, priority,
  deadline, and notes fields. Add/Edit/Delete all update the shared
  storage layer, so changes here also show up on the dashboard.
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Planner — Study Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="navbarRoot"></div>
  <div id="sidebarRoot"></div>

  <main id="pageContent" class="main-content">
    <div class="page-header">
      <h2>Study Planner</h2>
      <button class="btn btn-primary rounded-pill px-4" id="addTaskBtn"><i class="fa-solid fa-plus me-1"></i>Add Task</button>
    </div>

    <!-- Search box + 3 dropdowns: priority filter, status filter, sort order -->
    <div class="widget-card mb-3">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <input type="text" id="taskSearch" class="form-control" placeholder="Search tasks..." />
        </div>
        <div class="col-md-3">
          <select id="taskPriorityFilter" class="form-select">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="taskStatusFilter" class="form-select">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="taskSort" class="form-select">
            <option value="deadline">Sort: Deadline</option>
            <option value="priority">Sort: Priority</option>
            <option value="title">Sort: Title</option>
          </select>
        </div>
      </div>
    </div>

    <!-- renderTaskList() below fills this with one row per task -->
    <div id="taskList"></div>
  </main>

  <div id="fabRoot"></div>

  <!-- Shared modal for BOTH adding a new task and editing an existing one —
       which mode it's in depends on whether #taskId has a value (see openAddModal/openEditModal) -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="taskForm">
            <!-- Hidden field: empty means "adding new", filled means "editing this id" -->
            <input type="hidden" id="taskId" />
            <div class="mb-3">
              <label class="form-label">Task Title *</label>
              <input type="text" class="form-control" id="taskTitle" required />
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Subject</label>
                <select class="form-select" id="taskSubject"><option value="">None</option></select>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Priority</label>
                <select class="form-select" id="taskPriority">
                  <option value="high">High</option>
                  <option value="medium" selected>Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Deadline</label>
              <input type="date" class="form-control" id="taskDeadline" />
            </div>
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea class="form-control" id="taskNotes" rows="3"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveTaskBtn">Save Task</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import {
      getAllTasks, addTask, updateTask, deleteTask, toggleTaskComplete,
      searchTasks, filterTasks, sortTasks, getTaskById,
    } from '../js/modules/taskManager.js';
    import { getAllSubjects, getSubjectById } from '../js/modules/subjectManager.js';
    import { formatCountdown } from '../js/utils/dateHelpers.js';
    import { showToast } from '../js/components/toast.js';
    import { appReady } from '../js/app.js';

    // One shared Bootstrap Modal instance, reused for both add and edit
    const taskModal = new bootstrap.Modal(document.getElementById('taskModal'));

    // Fills the "Subject" dropdown inside the modal with every subject the user has
    function populateSubjectOptions() {
      const select = document.getElementById('taskSubject');
      select.innerHTML = '<option value="">None</option>' +
        getAllSubjects().map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    // Reads the current values of the search box + 3 dropdowns and returns
    // the task list after search, filtering, and sorting have all been applied
    function getFilteredTasks() {
      const query = document.getElementById('taskSearch').value;
      const priority = document.getElementById('taskPriorityFilter').value;
      const status = document.getElementById('taskStatusFilter').value;
      const sortBy = document.getElementById('taskSort').value;

      // Search first (if there's a query), otherwise start from the full list
      let tasks = query ? searchTasks(query) : getAllTasks();

      tasks = tasks.filter((t) => {
        if (priority && t.priority !== priority) return false;
        if (status === 'pending' && t.completed) return false;
        if (status === 'completed' && !t.completed) return false;
        return true;
      });

      return sortTasks(tasks, sortBy);
    }

    // Rebuilds the entire task list in the DOM from scratch —
    // simple to reason about, and this app's data sizes are small enough
    // that a full re-render on every change is not a performance problem
    function renderTaskList() {
      const container = document.getElementById('taskList');
      const tasks = getFilteredTasks();

      if (tasks.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-list-check"></i><p>No tasks match your filters. Add one to get started.</p></div>`;
        return;
      }

      container.innerHTML = tasks.map((t) => {
        const subject = t.subjectId ? getSubjectById(t.subjectId) : null;
        return `
          <div class="list-row ${t.completed ? 'is-completed' : ''}" data-id="${t.id}">
            <input type="checkbox" class="form-check-input task-complete-cb" ${t.completed ? 'checked' : ''} />
            ${subject ? `<span class="subject-dot" style="background:${subject.color}"></span>` : ''}
            <div class="flex-grow-1">
              <p class="list-row-title">${t.title}</p>
              <div class="small text-muted-custom">${subject ? subject.name + ' · ' : ''}${t.deadline ? formatCountdown(t.deadline) : 'No deadline'}${t.notes ? ' · ' + t.notes : ''}</div>
            </div>
            <span class="priority-badge priority-${t.priority}">${t.priority}</span>
            <button class="btn btn-sm btn-outline-primary edit-task-btn"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger delete-task-btn"><i class="fa-solid fa-trash"></i></button>
          </div>`;
      }).join('');

      // Since we rebuilt the HTML above, every button/checkbox is brand new —
      // event listeners have to be re-attached after every render
      attachRowEvents();
    }

    // Wires up the checkbox/edit/delete buttons on each row.
    // Uses data-id on the row + closest() to find which task a click belongs to.
    function attachRowEvents() {
      document.querySelectorAll('.task-complete-cb').forEach((cb) => {
        cb.addEventListener('change', (e) => {
          const id = e.target.closest('.list-row').dataset.id;
          toggleTaskComplete(id);
          renderTaskList();
        });
      });

      document.querySelectorAll('.edit-task-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => openEditModal(e.target.closest('.list-row').dataset.id));
      });

      document.querySelectorAll('.delete-task-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const id = e.target.closest('.list-row').dataset.id;
          if (!confirm('Delete this task?')) return; // simple native confirm — good enough for a delete action
          deleteTask(id);
          showToast('Task deleted', 'success');
          renderTaskList();
        });
      });
    }

    // Opens the modal in "add" mode: clears every field, including the hidden id
    function openAddModal() {
      document.getElementById('taskModalTitle').textContent = 'Add Task';
      document.getElementById('taskId').value = '';
      document.getElementById('taskForm').reset();
      taskModal.show();
    }

    // Opens the modal in "edit" mode: looks up the task by id and
    // pre-fills every field with its current values
    function openEditModal(id) {
      const task = getTaskById(id);
      if (!task) return;
      document.getElementById('taskModalTitle').textContent = 'Edit Task';
      document.getElementById('taskId').value = task.id;
      document.getElementById('taskTitle').value = task.title;
      document.getElementById('taskSubject').value = task.subjectId || '';
      document.getElementById('taskPriority').value = task.priority;
      document.getElementById('taskDeadline').value = task.deadline || '';
      document.getElementById('taskNotes').value = task.notes || '';
      taskModal.show();
    }

    // Runs when "Save Task" is clicked — decides add vs update
    // based on whether the hidden #taskId field has a value
    function saveTask() {
      const id = document.getElementById('taskId').value;
      const title = document.getElementById('taskTitle').value.trim();
      if (!title) { showToast('Task title is required', 'error'); return; }

      const payload = {
        title,
        subjectId: document.getElementById('taskSubject').value || null,
        priority: document.getElementById('taskPriority').value,
        deadline: document.getElementById('taskDeadline').value,
        notes: document.getElementById('taskNotes').value.trim(),
      };

      if (id) {
        updateTask(id, payload);
        showToast('Task updated', 'success');
      } else {
        addTask(payload);
        showToast('Task added', 'success');
      }

      taskModal.hide();
      renderTaskList(); // refresh the list so the change is visible immediately
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await appReady; // wait for session + data to load before rendering anything

      populateSubjectOptions();
      renderTaskList();

      document.getElementById('addTaskBtn').addEventListener('click', openAddModal);
      document.getElementById('saveTaskBtn').addEventListener('click', saveTask);

      // Re-render the list live as the user types/changes any filter control
      ['taskSearch', 'taskPriorityFilter', 'taskStatusFilter', 'taskSort'].forEach((id) => {
        document.getElementById(id).addEventListener('input', renderTaskList);
        document.getElementById(id).addEventListener('change', renderTaskList);
      });

      // Lets other parts of the app (e.g. the floating "+" button) open
      // this page's add-task modal by firing a custom event
      document.addEventListener('quickadd:task', openAddModal);
    });
  </script>
</body>
</html>
