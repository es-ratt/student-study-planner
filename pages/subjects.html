<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects — Study Planner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dark-mode.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="navbarRoot"></div>
  <div id="sidebarRoot"></div>

  <main id="pageContent" class="main-content">
    <div class="page-header">
      <h2>Subjects</h2>
      <button class="btn btn-primary rounded-pill px-4" id="addSubjectBtn"><i class="fa-solid fa-plus me-1"></i>Add Subject</button>
    </div>

    <div class="row" id="subjectsList"></div>
  </main>

  <div id="fabRoot"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { renderSubjects } from '../js/components/renderCard.js';
    import { injectSubjectModal, openAddSubjectModal } from '../js/components/renderModal.js';

    document.addEventListener('DOMContentLoaded', () => {
      injectSubjectModal();
      renderSubjects('subjectsList');

      document.getElementById('addSubjectBtn').addEventListener('click', openAddSubjectModal);
    });
  </script>
</body>
</html>
